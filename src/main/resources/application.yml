server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

  h2:
    console:
      enabled: true
      path: /h2
